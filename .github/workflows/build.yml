name: QCS Prueba — diseño acordado

on:
  workflow_dispatch:
  push:
    branches: [implementacion/etapa1-qcs]
    paths: ['app/**', '.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de prueba
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Conservar firma de las pruebas de diseño
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: qcs-prueba-diseno-debug-keystore-v1
      - name: Comprobar y preparar app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android
      - name: Compilar QCS Prueba
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renderizar acceso, Inicio y sumatorio
        working-directory: app
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory www &
          QCS_WEB_PID=$!
          trap 'kill "$QCS_WEB_PID" || true' EXIT
          mkdir -p previews
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:393,height:852}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8080');
          await page.locator('#password').waitFor();
          await page.screenshot({path:'previews/01-acceso.png',fullPage:true});
          await page.locator('#password').fill('contraseña de prueba visual');
          await page.locator('#enter').click();
          await page.locator('#open').waitFor();
          await page.screenshot({path:'previews/02-inicio.png',fullPage:true});
          if(await page.locator('.module-card').count()!==5) throw Error('Inicio incompleto');
          if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth)) throw Error('Desbordamiento horizontal');
          await page.locator('#open').click();
          await page.locator('#measure').click();
          await page.screenshot({path:'previews/03-codematch.png',fullPage:true});
          await page.locator('#sum').click();
          await page.screenshot({path:'previews/04-sumatorio.png',fullPage:true});
          if(await page.locator('dialog input').count()!==8) throw Error('Sumatorio incompleto');
          await browser.close();
          if(errors.length) throw Error(errors.join('\n'));
          JS
      - name: Guardar APK y vistas
        uses: actions/upload-artifact@v4
        with:
          name: QCS-Prueba-Diseno-0.1.2
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/previews/*.png
          if-no-files-found: error
