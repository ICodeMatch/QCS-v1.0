name: Build QCS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip QCS
        run: |
          unzip -q QCS-v1.0-FIXED.zip -d qcs-source
          cp -r qcs-source/QCS-Final/* .
          rm -rf qcs-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install & Build
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compile APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QCS-v1.0-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
