<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#123b52" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' blob: https://localhost capacitor:; frame-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>QCS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <img class="brand-mark" src="assets/qcs-logo.svg" alt="Logo QCS">
      <strong class="brand-title">Quality Control Suite</strong>
      <button id="back" class="header-action" hidden aria-label="Atrás">←</button>
      <button id="lock" hidden>Bloquear</button>
      <button id="settingsTop" class="header-action" hidden aria-label="Ajustes"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m10 3-.5 3-2 1-2.5-1-2 3 2 2v2l-2 2 2 3 2.5-1 2 1 .5 3h4l.5-3 2-1 2.5 1 2-3-2-2v-2l2-2-2-3-2.5 1-2-1-.5-3z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </header>
    <main id="app"></main>
    <p id="status" role="status" aria-live="polite"></p>
    <nav id="bottomnav" class="bottom-nav" aria-label="Navegación principal" hidden>
      <button data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h5v-7h4v7h5V9"/></svg><span>Inicio</span></button>
      <button data-nav="records"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h4M9 12h6M9 16h6"/></svg><span>Registros</span></button>
      <button data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m10 3-.5 3-2 1-2.5-1-2 3 2 2v2l-2 2 2 3 2.5-1 2 1 .5 3h4l.5-3 2-1 2.5 1 2-3-2-2v-2l2-2-2-3-2.5 1-2-1-.5-3z"/><circle cx="12" cy="12" r="3"/></svg><span>Ajustes</span></button>
    </nav>
    <script type="module" src="app.js"></script>
  </body>
</html>
