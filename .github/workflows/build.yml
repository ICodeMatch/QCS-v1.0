name: QCS Prueba — diseño acordado

on:
  workflow_dispatch:
  push:
    branches: [implementacion/etapa1-qcs]
    paths: ['app/**', '.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de prueba
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Comprobar y preparar app
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android
      - name: Compilar QCS Prueba
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renderizar acceso, Inicio y sumatorio
        working-directory: app
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8080 --directory www &
          QCS_WEB_PID=$!
          trap 'kill "$QCS_WEB_PID" || true' EXIT
          mkdir -p previews
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:393,height:852}});
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8080');
          await page.locator('#password').waitFor();
          await page.screenshot({path:'previews/01-acceso.png',fullPage:true});
          await page.locator('#password').fill('1234567');
          await page.locator('#enter').click();
          await page.locator('#status').filter({hasText:'al menos 8'}).waitFor();
          await page.locator('#password').fill('12345678');
          await page.locator('#enter').click();
          await page.locator('#open').waitFor();
          await page.screenshot({path:'previews/02-inicio.png',fullPage:true});
          if(await page.locator('.module-card').count()!==5) throw Error('Inicio incompleto');
          await page.getByText('Herramientas de calidad',{exact:true}).waitFor();
          await page.locator('#open').click();
          const cm=page.frameLocator('#codematchFrame');
          await cm.locator('#recordCount').waitFor();
          await page.waitForFunction(()=>document.querySelector('#codematchFrame')?.contentWindow.qcsCodeMatch?.ready);
          await page.screenshot({path:'previews/03-codematch.png',fullPage:true});
          await cm.locator('[data-calc-target="searchLength"]').click();
          if(await cm.locator('#foldCotaList input').count()!==8) throw Error('Sumatorio incompleto');
          await cm.locator('[data-cota-index="0"]').fill('1,005');
          await cm.locator('[data-cota-index="1"]').fill('2');
          await page.screenshot({path:'previews/04-sumatorio.png',fullPage:true});
          await cm.locator('#applyCotasBtn').click();
          if(await cm.locator('#searchLength').inputValue()!=='3,005') throw Error('Suma no aplicada al campo histórico');
          // Header Back closes a dialog, returns through module screens and reaches QCS Inicio.
          for(const view of ['library','plans','import']){
            await cm.locator('.bottom-nav [data-view="'+view+'"]').click();
            await cm.locator('#'+view+'View.active').waitFor();
            await page.locator('#back').click();
            await cm.locator('#searchView.active').waitFor();
          }
          await cm.locator('.bottom-nav [data-view="library"]').click();
          await cm.locator('#newRecordBtn').click();
          await cm.locator('#recordCode').fill('PRUEBA-001');
          await cm.locator('#recordName').fill('Referencia de prueba');
          await cm.locator('#developedLength').fill('5,6');
          await page.locator('#back').click();
          await cm.locator('#recordDialog').waitFor({state:'hidden'});
          await cm.locator('[data-edit="PRUEBA-001"]').waitFor();
          await cm.locator('[data-edit="PRUEBA-001"]').click();
          if(await cm.locator('#recordName').inputValue()!=='Referencia de prueba') throw Error('Ficha no conservada al volver');
          await page.locator('#back').click();
          await page.locator('#back').click();
          await cm.locator('#clearSearch').click();
          await cm.locator('#searchLength').fill('5,7');
          await cm.locator('#searchTolerance').fill('0,1');
          await cm.locator('#searchForm button[type="submit"]').click();
          await cm.locator('#results h2').filter({hasText:'Coincidencia · 1'}).waitFor();
          await page.locator('#back').click();
          await page.locator('#open').waitFor();
          await page.locator('[data-nav="records"]').click();
          await page.locator('body[data-screen="records"]').waitFor();
          if(await page.locator('#codematchFrame').count()) throw Error('Registros abre CodeMatch');
          await page.screenshot({path:'previews/05-registros.png',fullPage:true});
          await page.locator('#back').click();
          await page.locator('#open').waitFor();
          await page.locator('#settingsTop').click();
          await page.locator('#backup').waitFor();
          await page.locator('[data-nav="home"]').click();
          await page.locator('#open').waitFor();
          if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth)) throw Error('Desbordamiento horizontal');
          await browser.close();
          if(errors.length) throw Error(errors.join('\n'));
          JS
      - name: Preparar herramienta de firma para la entrega
        run: |
          mkdir -p tooling
          python3 - <<'PY_SIGN_TOOL'
          import os,glob,shutil
          paths=sorted(glob.glob(os.path.join(os.environ['ANDROID_HOME'],'build-tools','*','lib','apksigner.jar')))
          if not paths: raise SystemExit('No se encontró apksigner.jar en el SDK usado para compilar')
          shutil.copyfile(paths[-1],'tooling/apksigner.jar')
          PY_SIGN_TOOL
      - name: Guardar APK y vistas
        uses: actions/upload-artifact@v4
        with:
          name: QCS-Prueba-CodeMatch-0.1.4
          path: |
            app/android/app/build/outputs/apk/debug/*.apk
            app/previews/*.png
            tooling/apksigner.jar
          if-no-files-found: error
